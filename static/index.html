<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallPilot - AI Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand-section">
                <h1>CallPilot</h1>
                <div id="connectionStatus" class="status-indicator"></div>
            </div>
            <div class="host-profile" id="hostProfile">
                <span id="hostEmail"></span>
                <div class="host-avatar">
                    <i class="fas fa-user-tie"></i>
                </div>
            </div>
        </div>
        
        <div class="chat-window" id="log">
            <div class="message ai">
                <div class="avatar"><i class="fas fa-robot"></i></div>
                <div class="bubble">
                    Hello! I'm CallPilot. Tap the microphone to start talking properly.
                </div>
            </div>
        </div>

        <div class="controls">
            <div id="visualizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div>
            </div>
            <div id="statusText">Ready</div>
            <button id="talkBtn">
                <i class="fas fa-microphone"></i>
            </button>
            <div class="text-input-container">
                <input type="text" id="textInput" placeholder="Type your message..." />
                <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
